# P8: mypy configuration for Nanobot type checking
# Start with relaxed rules, only checking core modules.
# Goal: catch obvious type errors at dev time, not block CI.

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
show_error_codes = True
no_implicit_optional = True
check_untyped_defs = False
disallow_untyped_defs = False

# Only check these well-typed modules initially
files =
    tools/tool_schema.py,
    task_store.py,
    session_stats.py,
    project_detector.py,
    tui.py

# ── Per-module overrides ──

[mypy-tools.*]
ignore_missing_imports = True

[mypy-skills.*]
ignore_missing_imports = True

[mypy-litellm.*]
ignore_missing_imports = True

[mypy-aiofiles.*]
ignore_missing_imports = True

[mypy-pexpect.*]
ignore_missing_imports = True

# Exclude large legacy modules from transitive checking
[mypy-agentic_loop]
ignore_errors = True

[mypy-server_final]
ignore_errors = True

[mypy-system_prompts]
ignore_errors = True
