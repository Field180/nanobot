<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流式响应测试</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        h1 { color: #10b981; }
        .test-section {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .pass { background: rgba(16, 185, 129, 0.2); border-left: 3px solid #10b981; }
        .fail { background: rgba(239, 68, 68, 0.2); border-left: 3px solid #ef4444; }
        .pending { background: rgba(251, 191, 36, 0.2); border-left: 3px solid #fbbf24; }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #059669; }
        button:disabled { background: #6b7280; cursor: not-allowed; }
        #streamingOutput {
            background: #0f0f23;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 15px;
            min-height: 200px;
            white-space: pre-wrap;
            font-family: monospace;
            margin-top: 10px;
        }
        #console {
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry { margin: 2px 0; }
        .log-info { color: #3b82f6; }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-warn { color: #f59e0b; }
    </style>
</head>
<body>
    <h1>🧪 流式响应测试</h1>
    
    <div class="test-section">
        <h2>测试配置</h2>
        <div>
            <label>API URL: </label>
            <input type="text" id="apiUrl" value="http://localhost:8080" style="width: 300px;">
        </div>
        <div style="margin-top: 10px;">
            <label>测试消息: </label>
            <input type="text" id="testMessage" value="请用一句话介绍Python" style="width: 300px;">
        </div>
        <div style="margin-top: 10px;">
            <button onclick="runAllTests()">运行所有测试</button>
            <button onclick="testStreamResponse()">测试流式响应</button>
            <button onclick="testAbortStream()">测试中断流</button>
            <button onclick="clearConsole()">清空日志</button>
        </div>
    </div>

    <div class="test-section">
        <h2>测试结果</h2>
        <div id="testResults"></div>
    </div>

    <div class="test-section">
        <h2>流式输出</h2>
        <div id="streamingOutput">等待测试...</div>
    </div>

    <div class="test-section">
        <h2>控制台日志</h2>
        <div id="console"></div>
    </div>

    <script>
        // 日志函数
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
            document.getElementById('streamingOutput').textContent = '等待测试...';
            document.getElementById('testResults').innerHTML = '';
        }

        // 添加测试结果
        function addResult(name, passed, message = '') {
            const results = document.getElementById('testResults');
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'pass' : 'fail'}`;
            div.innerHTML = `<strong>${passed ? '✅' : '❌'} ${name}</strong>${message ? ': ' + message : ''}`;
            results.appendChild(div);
        }

        function addPending(name) {
            const results = document.getElementById('testResults');
            const div = document.createElement('div');
            div.className = 'test-result pending';
            div.innerHTML = `<strong>⏳ ${name}</strong>`;
            results.appendChild(div);
            return div;
        }

        // 测试1: API连接性
        async function testAPIConnection() {
            log('测试API连接性...', 'info');
            try {
                const response = await fetch(`${document.getElementById('apiUrl').value}/api/status`);
                const data = await response.json();
                if (response.ok && data.status === 'ok') {
                    log('API连接成功', 'success');
                    addResult('API连接性', true, `status: ${data.status}`);
                    return true;
                } else {
                    log('API返回异常状态', 'error');
                    addResult('API连接性', false, JSON.stringify(data));
                    return false;
                }
            } catch (e) {
                log(`API连接失败: ${e.message}`, 'error');
                addResult('API连接性', false, e.message);
                return false;
            }
        }

        // 测试2: 流式响应
        async function testStreamResponse() {
            const apiUrl = document.getElementById('apiUrl').value;
            const message = document.getElementById('testMessage').value;
            const output = document.getElementById('streamingOutput');
            
            log('开始流式响应测试...', 'info');
            const pendingDiv = addPending('流式响应');
            output.textContent = '🔄 正在连接...';
            
            let receivedChunks = 0;
            let totalContent = '';
            let startTime = Date.now();
            let hasStart = false;
            let hasDone = false;
            let hasHeartbeat = false;

            try {
                const response = await fetch(`${apiUrl}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: 'test_stream_' + Date.now(),
                        history: [],
                        model: 'qwen3.5:122b',
                        backend: 'ollama'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                log('连接成功，开始读取流...', 'success');
                output.textContent = '';

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        log('流读取完成', 'info');
                        break;
                    }

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.type === 'start') {
                                    hasStart = true;
                                    log('收到start事件', 'info');
                                    output.textContent = '🤔 思考中...';
                                } else if (data.type === 'chunk') {
                                    receivedChunks++;
                                    totalContent += data.content;
                                    output.textContent = totalContent;
                                } else if (data.type === 'heartbeat') {
                                    hasHeartbeat = true;
                                    log(`心跳: 已运行 ${data.elapsed} 秒`, 'info');
                                } else if (data.type === 'done') {
                                    hasDone = true;
                                    log('收到done事件', 'success');
                                } else if (data.type === 'error') {
                                    log(`错误: ${data.message}`, 'error');
                                }
                            } catch (e) {
                                // JSON解析错误，忽略
                            }
                        }
                    }
                }

                const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
                const passed = hasStart && receivedChunks > 0 && hasDone;
                
                pendingDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
                pendingDiv.innerHTML = `<strong>${passed ? '✅' : '❌'} 流式响应</strong>: 
                    chunks=${receivedChunks}, time=${elapsed}s, 
                    start=${hasStart}, done=${hasDone}, heartbeat=${hasHeartbeat}`;
                
                log(`测试完成: ${passed ? '通过' : '失败'}`, passed ? 'success' : 'error');
                return passed;

            } catch (e) {
                pendingDiv.className = 'test-result fail';
                pendingDiv.innerHTML = `<strong>❌ 流式响应</strong>: ${e.message}`;
                log(`流式响应失败: ${e.message}`, 'error');
                output.textContent = `错误: ${e.message}`;
                return false;
            }
        }

        // 测试3: 中断流
        async function testAbortStream() {
            const apiUrl = document.getElementById('apiUrl').value;
            const message = document.getElementById('testMessage').value;
            const output = document.getElementById('streamingOutput');
            
            log('开始中断流测试...', 'info');
            const pendingDiv = addPending('中断流');
            output.textContent = '🔄 正在连接...';
            
            const controller = new AbortController();
            let receivedChunks = 0;
            let wasAborted = false;

            try {
                // 500ms后中断
                setTimeout(() => {
                    log('发送中断信号...', 'warn');
                    controller.abort();
                }, 500);

                const response = await fetch(`${apiUrl}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: 'test_abort_' + Date.now(),
                        history: [],
                        model: 'qwen3.5:122b',
                        backend: 'ollama'
                    }),
                    signal: controller.signal
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'chunk') {
                                    receivedChunks++;
                                    output.textContent += data.content;
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (e) {
                if (e.name === 'AbortError') {
                    wasAborted = true;
                    log('成功中断流', 'success');
                } else {
                    log(`中断失败: ${e.message}`, 'error');
                }
            }

            const passed = wasAborted;
            pendingDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            pendingDiv.innerHTML = `<strong>${passed ? '✅' : '❌'} 中断流</strong>: 
                aborted=${wasAborted}, chunks=${receivedChunks}`;
            
            return passed;
        }

        // 运行所有测试
        async function runAllTests() {
            clearConsole();
            log('========== 开始所有测试 ==========', 'info');
            
            const results = [];
            
            results.push(await testAPIConnection());
            results.push(await testStreamResponse());
            results.push(await testAbortStream());
            
            const passed = results.filter(r => r).length;
            const total = results.length;
            
            log(`========== 测试完成: ${passed}/${total} 通过 ==========`, 
                passed === total ? 'success' : 'warn');
        }

        // 页面加载时测试连接
        window.addEventListener('DOMContentLoaded', () => {
            log('测试页面已加载', 'info');
            testAPIConnection();
        });
    </script>
</body>
</html>
