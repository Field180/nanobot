name: CI

on:
  push:
    branches: [main, refactor-safe-baseline]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Backend unit tests
        run: make test

      - name: Audit fix tests
        run: make test-audit

      - name: Deprecation ratchet
        run: make test-deprecations

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright + browsers
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          .venv/bin/python -m flask --app app:create_app run --port 5000 &
          sleep 5

      - name: Run E2E tests
        env:
          CI: "1"
        run: make test-e2e