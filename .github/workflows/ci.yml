name: CI

on:
  push:
    branches: [main, refactor-safe-baseline]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      PYTHON: python3
      PIP: pip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Backend unit tests
        run: make test

      - name: Audit fix tests
        run: make test-audit

      - name: Deprecation ratchet
        run: make test-deprecations

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      PYTHON: python3
      PIP: pip
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + browsers
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          python3 server.py &
          sleep 8
          curl -fsS http://localhost:8080/ > /dev/null || (echo "Backend failed to start"; exit 1)

      - name: Run E2E tests
        run: make test-e2e